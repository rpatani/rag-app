<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span>Knowledge Assistant</span>
        </div>
        <div class="status-pill" id="status">
          <span class="status-dot"></span>
          <span class="status-text">connecting…</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="section-label">Documents</div>

        <div class="upload-zone" id="upload-zone" role="button" tabindex="0" aria-label="Upload documents">
          <svg class="upload-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p class="upload-primary">Drop files here</p>
          <p class="upload-secondary">PDF, DOCX, TXT, MD · up to 50 MB</p>
          <button class="browse-btn" id="browse-btn" type="button">Browse files</button>
          <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md" hidden />
        </div>

        <ul class="doc-list" id="doc-list">
          <li class="doc-empty">No documents yet.</li>
        </ul>
      </div>

      <div class="sidebar-footer" id="model-info"></div>
    </aside>

    <!-- Main chat -->
    <main class="chat">
      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <h2>Ask your documents anything</h2>
          <p>Upload documents in the sidebar, then ask a question below.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion" data-q="What are the meal expense limits?">What are the meal expense limits?</button>
            <button class="suggestion" data-q="Who is eligible for remote work?">Who is eligible for remote work?</button>
            <button class="suggestion" data-q="What equipment does the company provide?">What equipment does the company provide?</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <form id="query-form">
          <textarea
            id="question-input"
            placeholder="Ask a question about your documents…"
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="send-button" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
